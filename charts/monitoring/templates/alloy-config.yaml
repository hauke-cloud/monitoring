{{- $obs := .Values.observability -}}
{{- if .Values.alloy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.alloy.alloy.configMap.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
data:
  {{ .Values.alloy.alloy.configMap.key | default "config.alloy" }}: |
    logging {
      level  = "info"
      format = "logfmt"
    }
    {{- if and $obs.podLogs.enabled .Values.loki.enabled }}

    // Only the pods of the node this instance runs on: their log files are
    // the ones mounted from the host.
    discovery.kubernetes "pods" {
      role = "pod"

      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      // The first of these that is set.
      rule {
        source_labels = [
          "__meta_kubernetes_pod_label_app_kubernetes_io_name",
          "__meta_kubernetes_pod_label_app",
          "__meta_kubernetes_pod_controller_name",
          "__meta_kubernetes_pod_name",
        ]
        separator    = ";"
        regex        = "^;*([^;]+)(;.*)?$"
        target_label = "app"
      }

      rule {
        source_labels = ["namespace", "app"]
        separator     = "/"
        target_label  = "job"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      // Strips the container runtime's prefix and takes over its timestamp
      // and stream.
      stage.cri { }

      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "{{ include "monitoring.loki.url" . }}/loki/api/v1/push"
      }
      {{- with $obs.cluster }}

      external_labels = {
        cluster = {{ . | quote }},
      }
      {{- end }}
    }
    {{- end }}
{{- end }}
